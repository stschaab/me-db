<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next2You · Chats</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="presence.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; }
header { background: #1a1a2e; color: white; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 1.1rem; font-weight: 700; }
header h1 span { color: #00b4d8; }
.nav-links { display: flex; gap: 14px; }
.nav-links a { color: #7ec8e3; font-size: 0.8rem; text-decoration: none; }
.nav-links a:hover { text-decoration: underline; }
.container { max-width: 540px; margin: 0 auto; padding: 20px 16px; }
.conv { display: flex; align-items: center; gap: 12px; background: white; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); text-decoration: none; color: inherit; }
.conv:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
.avatar { position: relative; width: 42px; height: 42px; border-radius: 50%; background: #00b4d8; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.body { flex: 1; min-width: 0; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.name { font-weight: 700; font-size: 0.95rem; }
.time { font-size: 0.7rem; color: #aaa; white-space: nowrap; }
.last { font-size: 0.85rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.conv.unread .last { color: #1a1a2e; font-weight: 600; }
.st-dot { position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid white; }
.st-dot.active { background: #2ecc71; } .st-dot.idle { background: #f5a623; } .st-dot.offline { background: #9aa0a6; }
.st-text { font-size: 0.7rem; font-weight: 400; margin-left: 6px; }
.st-text.active { color: #1e9e57; } .st-text.idle { color: #b7791f; } .st-text.offline { color: #999; }
.badge { background: #00b4d8; color: white; border-radius: 12px; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; flex-shrink: 0; }
.del-btn { background: none; border: none; font-size: 1rem; padding: 6px; margin: -6px -6px -6px 0; cursor: pointer; opacity: 0.35; flex-shrink: 0; }
.del-btn:hover { opacity: 0.8; }
.empty { text-align: center; color: #888; padding: 48px 20px; font-size: 0.9rem; line-height: 1.6; }
.empty a { color: #00b4d8; }
</style>
</head>
<body>

<header>
  <h1>Next<span>2</span>You</h1>
  <div class="nav-links">
    <a href="map.html">Karte</a>
    <a href="settings.html">⚙</a>
  </div>
</header>

<div class="container" id="list"><div class="empty">Lade…</div></div>

<script>
const SUPABASE_URL = 'https://thgawuqcogugzurrijkp.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoZ2F3dXFjb2d1Z3p1cnJpamtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MTI1MTIsImV4cCI6MjA5NjM4ODUxMn0.IK7vJwPdmZ7OFCMq1QfI5wTM4B6IBw-04AJoJun-s8w';
const db = supabase.createClient(SUPABASE_URL, ANON_KEY, { auth: { storageKey: 'n2y-auth' } });
let convs = [];

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtWhen(ts) {
  const d = new Date(ts);
  if (d.toDateString() === new Date().toDateString())
    return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
}

async function load() {
  const [{ data, error }, { data: pres }] = await Promise.all([
    db.rpc('n2y_my_conversations'), db.rpc('n2y_partner_presence')]);
  const presence = Object.fromEntries((pres || []).map(p => [p.partner_id, p]));
  const list = document.getElementById('list');
  convs = data || [];
  if (error) { list.innerHTML = '<div class="empty">Fehler: ' + escHtml(error.message) + '</div>'; return; }
  if (!data.length) {
    list.innerHTML = '<div class="empty">Noch keine Gespräche.<br><a href="map.html">Auf der Karte jemanden anschreiben →</a></div>';
    return;
  }
  list.innerHTML = data.map(c => {
    const name = c.partner_nickname || 'Anonym';
    const st = n2yStatus(presence[c.partner_id]);
    return `<a class="conv${c.unread ? ' unread' : ''}" href="chat.html?conv=${c.conversation_id}">
      <div class="avatar">${escHtml(name[0].toUpperCase())}${st ? `<span class="st-dot ${st.cls}"></span>` : ''}</div>
      <div class="body">
        <div class="row"><span class="name">${escHtml(name)}${st ? `<span class="st-text ${st.cls}">${st.cls === 'idle' ? n2yIdleLabel(presence[c.partner_id].inactive_min) : (st.cls === 'active' ? 'aktiv' : 'offline · ' + n2yLastSeenLabel(presence[c.partner_id].inactive_min, true))}</span>` : ''}</span><span class="time">${fmtWhen(c.last_at)}</span></div>
        <div class="last">${escHtml(c.last_message || 'Noch keine Nachrichten')}</div>
      </div>
      ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}
      <button class="del-btn" title="Chat löschen" onclick="deleteChat(event, '${c.conversation_id}')">🗑</button>
    </a>`;
  }).join('');
}

// Hides the chat only for me; messages stay stored (and visible to the partner)
async function deleteChat(e, convId) {
  e.preventDefault(); e.stopPropagation();
  const name = convs.find(c => c.conversation_id === convId)?.partner_nickname || 'Anonym';
  if (!confirm('Chat mit ' + name + ' löschen?\n\nEr verschwindet nur bei dir. Schreibt ' + name + ' dir erneut, erscheint der Chat wieder – nur mit den neuen Nachrichten.')) return;
  const { error } = await db.rpc('n2y_delete_chat', { p_conversation: convId });
  if (error) { alert('Fehler: ' + error.message); return; }
  load();
}

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  n2yPresence(db, SUPABASE_URL, ANON_KEY);
  await load();
  setInterval(load, 60000);
  db.channel('n2y-inbox')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'n2y_messages' }, load)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'n2y_messages' }, (p) => { if (p.new?.deleted_at) load(); })
    .subscribe();
}

init();
</script>
</body>
</html>
