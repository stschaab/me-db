<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Next2You · Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="presence.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
header { background: #1a1a2e; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-size: 1.1rem; font-weight: 700; }
header h1 span { color: #00b4d8; }
.nav-links { display: flex; gap: 14px; }
.nav-links a { color: #7ec8e3; font-size: 0.8rem; text-decoration: none; }
.nav-links a:hover { text-decoration: underline; }

.tabs { background: #16213e; display: flex; gap: 6px; padding: 8px 12px 0; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 10px 10px 0 0; background: #24305a; color: #c9d6f0; font-size: 0.82rem; cursor: pointer; white-space: nowrap; border: none; font-family: inherit; flex-shrink: 0; }
.tab:hover { background: #2d3b6b; }
.tab.active { background: white; color: #1a1a2e; font-weight: 700; }
.tab .t-av { position: relative; width: 20px; height: 20px; border-radius: 50%; background: #00b4d8; color: white; font-size: 0.68rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.tab .t-badge { background: #ff5a5f; color: white; border-radius: 10px; font-size: 0.66rem; font-weight: 700; padding: 1px 6px; }
.tab.active .t-badge { display: none; }

.chat-header { background: white; padding: 12px 16px 10px; border-bottom: 1px solid #e8eaed; flex-shrink: 0; }
.ch-row { display: flex; align-items: center; gap: 12px; }
.chat-avatar { position: relative; width: 38px; height: 38px; border-radius: 50%; background: #00b4d8; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; }
.chat-partner-name { font-weight: 700; font-size: 0.95rem; }
.chat-partner-meta { font-size: 0.72rem; color: #888; }
.chat-partner-status { font-size: 0.72rem; margin-top: 1px; }
.chat-partner-status.active { color: #1e9e57; } .chat-partner-status.idle { color: #b7791f; } .chat-partner-status.offline { color: #888; }
.st-dot { position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid white; }
.st-dot.active { background: #2ecc71; } .st-dot.idle { background: #f5a623; } .st-dot.offline { background: #9aa0a6; }
.tab .st-dot { width: 8px; height: 8px; border-width: 1.5px; border-color: #24305a; }
.tab.active .st-dot { border-color: white; }
.location-share-btn { margin-left: auto; padding: 7px 12px; border: 1px solid #00b4d8; border-radius: 8px; background: white; color: #00b4d8; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.location-share-btn:hover { background: #e8f8fc; }
.interests { margin-top: 10px; background: #f0f8fb; border-radius: 10px; padding: 8px 11px; font-size: 0.82rem; line-height: 1.4; color: #2b3a4a; cursor: pointer; }
.interests .i-label { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #0092b0; margin-bottom: 2px; }
.interests .i-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.interests.open .i-text { display: block; max-height: 30vh; overflow-y: auto; }
.interests .i-more { font-size: 0.7rem; color: #0092b0; margin-top: 3px; }

.messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
.msg.mine { align-self: flex-end; background: #00b4d8; color: white; border-bottom-right-radius: 4px; }
.msg.theirs { align-self: flex-start; background: white; color: #1a1a2e; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.msg .time { font-size: 0.65rem; opacity: 0.65; margin-top: 3px; }
.msg.mine .time { text-align: right; }
.msg-day-sep { text-align: center; font-size: 0.7rem; color: #aaa; padding: 8px 0; }
.typing { font-size: 0.78rem; color: #888; padding: 0 18px; min-height: 20px; line-height: 20px; flex-shrink: 0; }
.typing .dots span { animation: tdot 1.2s infinite; }
.typing .dots span:nth-child(2) { animation-delay: 0.2s; }
.typing .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
.compose { background: white; border-top: 1px solid #e8eaed; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
.compose textarea { flex: 1; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 20px; font-size: 16px; font-family: inherit; resize: none; outline: none; max-height: 100px; line-height: 1.4; transition: border-color 0.15s; }
.compose textarea:focus { border-color: #00b4d8; }
.send-btn { width: 42px; height: 42px; border-radius: 50%; background: #00b4d8; color: white; border: none; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
.send-btn:hover { background: #0092b0; }
.send-btn:disabled { background: #b0d8e8; cursor: not-allowed; }
.info { text-align: center; padding: 40px 20px; color: #888; font-size: 0.9rem; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <h1>Next<span>2</span>You</h1>
  <div class="nav-links">
    <a href="chats.html">💬 Chats</a>
    <a href="map.html">Karte</a>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="chat-header">
  <div class="ch-row">
    <div class="chat-avatar" id="chatAvatar">?</div>
    <div>
      <div class="chat-partner-name" id="chatPartnerName">…</div>
      <div class="chat-partner-meta" id="chatPartnerMeta"></div>
      <div class="chat-partner-status" id="chatPartnerStatus"></div>
    </div>
    <button class="location-share-btn" onclick="shareLocation()">📍 Standort teilen</button>
  </div>
  <div class="interests" id="interests" style="display:none" onclick="this.classList.toggle('open'); updateMore()">
    <div class="i-label">Interessen</div>
    <div class="i-text" id="interestsText"></div>
    <div class="i-more" id="interestsMore"></div>
  </div>
</div>

<div class="messages" id="messages"><div class="info">Lade Chat…</div></div>

<div class="typing" id="typing"></div>

<div class="compose">
  <textarea id="msgInput" placeholder="Schreib eine Nachricht…" rows="1"
    oninput="onInput(this); sendTyping()" onkeydown="onKey(event)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
</div>

<script>
const SUPABASE_URL = 'https://thgawuqcogugzurrijkp.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoZ2F3dXFjb2d1Z3p1cnJpamtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MTI1MTIsImV4cCI6MjA5NjM4ODUxMn0.IK7vJwPdmZ7OFCMq1QfI5wTM4B6IBw-04AJoJun-s8w';
const db = supabase.createClient(SUPABASE_URL, ANON_KEY, { auth: { storageKey: 'n2y-auth' } });
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

let myId = null;
let convs = [];             // from n2y_my_conversations
let activeConv = null;      // conversation id
let lastDay = '';
let openToken = 0;          // guards against late responses after switching tabs
const drafts = {};
let presence = {};          // partner_id -> row of n2y_partner_presence
const profiles = {};
let typingChannel = null, typingTimer = null, lastTypingSent = 0;

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
function fmtDay(ts) {
  const d = new Date(ts), today = new Date();
  if (d.toDateString() === today.toDateString()) return 'Heute';
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return 'Gestern';
  return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
}

function onInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  document.getElementById('sendBtn').disabled = el.value.trim() === '';
  if (activeConv) drafts[activeConv] = el.value;
}
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = convs.map(c => {
    const name = c.partner_nickname || 'Anonym';
    const unread = Number(c.unread || 0);
    return `<button class="tab${c.conversation_id === activeConv ? ' active' : ''}" onclick="openConversation('${c.conversation_id}')">
      <span class="t-av">${escHtml(name[0].toUpperCase())}${dotHtml(c.partner_id)}</span>${escHtml(name)}${unread ? `<span class="t-badge">${unread}</span>` : ''}
    </button>`;
  }).join('');
  const active = el.querySelector('.tab.active');
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function dotHtml(partnerId) {
  const st = n2yStatus(presence[partnerId]);
  return st ? `<span class="st-dot ${st.cls}" title="${st.text}"></span>` : '';
}

function renderPartnerStatus() {
  const conv = convs.find(c => c.conversation_id === activeConv);
  const st = conv ? n2yStatus(presence[conv.partner_id]) : null;
  const el = document.getElementById('chatPartnerStatus');
  el.className = 'chat-partner-status' + (st ? ' ' + st.cls : '');
  el.textContent = st ? st.text : '';
  const av = document.getElementById('chatAvatar');
  av.querySelector('.st-dot')?.remove();
  if (st && conv) av.insertAdjacentHTML('beforeend', dotHtml(conv.partner_id));
}

async function loadPresence() {
  const { data } = await db.rpc('n2y_partner_presence');
  presence = Object.fromEntries((data || []).map(p => [p.partner_id, p]));
  renderTabs();
  renderPartnerStatus();
}

async function loadConvs() {
  const { data } = await db.rpc('n2y_my_conversations');
  convs = data || [];
  const a = convs.find(c => c.conversation_id === activeConv);
  if (a) a.unread = 0;
  renderTabs();
}

function updateMore() {
  const box = document.getElementById('interests');
  const t = document.getElementById('interestsText');
  const clipped = t.scrollHeight > t.clientHeight + 2;
  document.getElementById('interestsMore').textContent =
    box.classList.contains('open') ? 'weniger' : (clipped ? 'mehr anzeigen' : '');
}

function showProfile(p) {
  const name = p?.nickname || 'Anonym';
  document.getElementById('chatPartnerName').textContent = name;
  document.getElementById('chatAvatar').textContent = name[0].toUpperCase();
  const g = p?.gender === 'm' ? 'Mann' : p?.gender === 'f' ? 'Frau' : p?.gender === 'd' ? 'Divers' : '';
  const age = p?.age_years ? (g ? ', ' : '') + p.age_years + ' J.' : '';
  document.getElementById('chatPartnerMeta').textContent = (g + age) || 'Anonymer Nutzer';
  const box = document.getElementById('interests');
  box.classList.remove('open');
  if (p?.topics_text) {
    document.getElementById('interestsText').textContent = p.topics_text;
    box.style.display = 'block';
    requestAnimationFrame(updateMore);
  } else {
    box.style.display = 'none';
  }
}

async function getProfile(partnerId) {
  if (profiles[partnerId]) return profiles[partnerId];
  const { data } = await db.rpc('n2y_profile', { p_id: partnerId });
  return (profiles[partnerId] = (data && data[0]) || null);
}

function appendMessage(msg) {
  const container = document.getElementById('messages');
  const day = fmtDay(msg.created_at);
  if (day !== lastDay) {
    const sep = document.createElement('div');
    sep.className = 'msg-day-sep'; sep.textContent = day;
    container.appendChild(sep);
    lastDay = day;
  }
  const div = document.createElement('div');
  div.className = 'msg ' + (msg.sender_id === myId ? 'mine' : 'theirs');
  div.innerHTML = escHtml(msg.content) + '<div class="time">' + fmtTime(msg.created_at) + '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// "tippt…" via Realtime broadcast on channel typing:<conversation>; test personas use the same channel
function subscribeTyping(convId) {
  if (typingChannel) db.removeChannel(typingChannel);
  hideTyping();
  typingChannel = db.channel('typing:' + convId)
    .on('broadcast', { event: 'typing' }, ({ payload }) => {
      if (payload?.user_id && payload.user_id !== myId) showTyping();
    })
    .subscribe();
}

function showTyping() {
  const conv = convs.find(c => c.conversation_id === activeConv);
  document.getElementById('typing').innerHTML = escHtml(conv?.partner_nickname || 'Jemand') +
    ' tippt<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
  clearTimeout(typingTimer);
  typingTimer = setTimeout(hideTyping, 4000);
}

function hideTyping() {
  clearTimeout(typingTimer);
  document.getElementById('typing').innerHTML = '';
}

function sendTyping() {
  if (!typingChannel || !document.getElementById('msgInput').value.trim() || Date.now() - lastTypingSent < 2500) return;
  lastTypingSent = Date.now();
  typingChannel.send({ type: 'broadcast', event: 'typing', payload: { user_id: myId } });
}

async function openConversation(id) {
  if (!id) return;
  const token = ++openToken;
  activeConv = id;
  history.replaceState(null, '', 'chat.html?conv=' + id);
  subscribeTyping(id);

  const conv = convs.find(c => c.conversation_id === id);
  if (conv) conv.unread = 0;
  renderTabs();

  const input = document.getElementById('msgInput');
  input.value = drafts[id] || '';
  onInput(input);

  const messagesEl = document.getElementById('messages');
  messagesEl.innerHTML = '<div class="info">Lade Chat…</div>';
  lastDay = '';

  const partnerId = conv?.partner_id;
  const [profile, { data: messages }] = await Promise.all([
    partnerId ? getProfile(partnerId) : Promise.resolve(null),
    db.from('n2y_messages').select('*').eq('conversation_id', id).order('created_at', { ascending: true })
  ]);
  if (token !== openToken) return;

  showProfile(profile || { nickname: conv?.partner_nickname });
  renderPartnerStatus();
  messagesEl.innerHTML = '';
  if (!messages || !messages.length) {
    messagesEl.innerHTML = '<div class="info" id="emptyMsg">Noch keine Nachrichten. Fang einfach an!</div>';
  } else {
    messages.forEach(appendMessage);
    db.rpc('n2y_mark_read', { p_conversation: id }).then(() => {});
  }
}

async function resolveConversation(partnerId) {
  const pairFilter = `and(user1_id.eq.${myId},user2_id.eq.${partnerId}),and(user1_id.eq.${partnerId},user2_id.eq.${myId})`;
  const { data: existing } = await db.from('n2y_conversations').select('id').or(pairFilter).maybeSingle();
  if (existing) return existing.id;
  const { data: created, error } = await db.from('n2y_conversations')
    .insert({ user1_id: myId, user2_id: partnerId }).select('id').single();
  if (!error) return created.id;
  if (error.code === '23505') {
    const { data: again } = await db.from('n2y_conversations').select('id').or(pairFilter).maybeSingle();
    return again?.id || null;
  }
  throw error;
}

function onNewMessage(msg) {
  if (msg.sender_id !== myId) {
    presence[msg.sender_id] = { ...(presence[msg.sender_id] || {}), status: presence[msg.sender_id]?.status === 'hidden' ? 'hidden' : 'active', inactive_min: 0 };
    renderPartnerStatus();
  }
  if (msg.conversation_id === activeConv) {
    if (msg.sender_id !== myId) hideTyping();
    document.getElementById('emptyMsg')?.remove();
    appendMessage(msg);
    if (msg.sender_id !== myId) db.rpc('n2y_mark_read', { p_conversation: activeConv }).then(() => {});
    const c = convs.find(c => c.conversation_id === activeConv);
    if (c) { c.last_message = msg.content; c.last_at = msg.created_at; }
  } else {
    loadConvs();
  }
}

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  n2yPresence(db, SUPABASE_URL, ANON_KEY);
  myId = session.user.id;

  const params = new URLSearchParams(location.search);
  const withId = params.get('with');
  let convId = params.get('conv');
  if ((withId && (!UUID_RE.test(withId) || withId === myId)) || (convId && !UUID_RE.test(convId))) {
    document.getElementById('messages').innerHTML = '<div class="info">Ungültiger Chat-Link.</div>';
    return;
  }

  try {
    if (!convId && withId) convId = await resolveConversation(withId);
  } catch (e) {
    document.getElementById('messages').innerHTML = '<div class="info">Fehler: ' + escHtml(e.message) + '</div>';
    return;
  }

  activeConv = convId;
  await loadConvs();
  if (!convId) convId = convs[0]?.conversation_id;
  if (!convId) {
    document.getElementById('messages').innerHTML =
      '<div class="info">Noch keine Gespräche.<br><a href="map.html" style="color:#00b4d8">Auf der Karte jemanden anschreiben →</a></div>';
    return;
  }
  openConversation(convId);
  loadPresence();
  setInterval(loadPresence, 60000);

  db.channel('n2y-chat')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'n2y_messages' }, (p) => onNewMessage(p.new))
    .subscribe();
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content || !activeConv) return;
  const conv = activeConv;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';
  drafts[conv] = '';

  const { error } = await db.from('n2y_messages').insert({ conversation_id: conv, sender_id: myId, content });
  if (error) {
    alert('Fehler: ' + error.message);
    drafts[conv] = content;
    if (conv === activeConv) input.value = content;
  }
  document.getElementById('sendBtn').disabled = input.value.trim() === '';
  input.focus();
}

function shareLocation() {
  navigator.geolocation.getCurrentPosition((pos) => {
    const lat = pos.coords.latitude.toFixed(5);
    const lng = pos.coords.longitude.toFixed(5);
    const input = document.getElementById('msgInput');
    input.value = '📍 Mein genauer Standort: ' + `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=18/${lat}/${lng}`;
    onInput(input);
  }, () => alert('GPS-Zugriff verweigert.'), { enableHighAccuracy: true });
}

// Mobile keyboard: keep the layout inside the visible area so menu and tabs stay on top
if (window.visualViewport) {
  const fit = () => {
    document.body.style.height = window.visualViewport.height + 'px';
    window.scrollTo(0, 0);
    const m = document.getElementById('messages');
    if (document.activeElement?.id === 'msgInput') m.scrollTop = m.scrollHeight;
  };
  window.visualViewport.addEventListener('resize', fit);
  fit();
}

init();
</script>
</body>
</html>
